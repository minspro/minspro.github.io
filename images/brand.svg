<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0066FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Icon Container (Center at 80, 80) -->
  <g transform="translate(15, 15)">
    <!-- Ambient Glow / Shadow -->
    <rect x="10" y="10" width="110" height="110" rx="30" fill="url(#glow)" filter="url(#shadow)"/>
    
    <!-- Outer Rounded Squircle Base -->
    <rect x="10" y="10" width="110" height="110" rx="28" fill="#0B132B"/>
    <rect x="10" y="10" width="110" height="110" rx="28" stroke="url(#grad1)" stroke-width="2" stroke-opacity="0.4"/>
    
    <!-- Stylized Geometric "M" Network Structure -->
    <!-- Left Pillar -->
    <path d="M35 96 V46 C35 41.5 38.5 38 43 38 C47.5 38 51 41.5 51 46 V96" stroke="url(#grad1)" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Center Diagonal Left -->
    <path d="M43 45 L65 78" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Center Diagonal Right -->
    <path d="M65 78 L87 45" stroke="url(#grad2)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Right Pillar -->
    <path d="M79 46 C79 41.5 82.5 38 87 38 C91.5 38 95 41.5 95 46 V96" stroke="url(#grad2)" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Connecting Cyber Nodes -->
    <circle cx="43" cy="45" r="4.5" fill="#FFFFFF"/>
    <circle cx="87" cy="45" r="4.5" fill="#FFFFFF"/>
    <circle cx="65" cy="78" r="6" fill="#00E5FF"/>
    <circle cx="65" cy="78" r="2.5" fill="#FFFFFF"/>
    <circle cx="43" cy="96" r="3.5" fill="#00E5FF"/>
    <circle cx="87" cy="96" r="3.5" fill="#818CF8"/>
  </g>

  <!-- Typography: 敏思信息 -->
  <text x="165" y="82" font-family="'Hiragino Sans GB', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="52" fill="#0F172A" letter-spacing="3">敏思信息</text>
  
  <!-- Typography: mins.pro -->
  <text x="168" y="118" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="#0284C7" letter-spacing="4.5">MINS.PRO</text>
</svg>
